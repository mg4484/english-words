<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5B4FE0">
<title>מילים באנגלית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="lz-string.min.js"></script>
<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#24213A; --muted:#6E6A86; --line:#EDE6DA;
  --pri:#5B4FE0; --pri2:#ECEAFF; --acc:#FF7A59; --acc2:#FFE9E2;
  --ok:#22A06B; --ok2:#DFF5EA; --bad:#E0434D; --bad2:#FDE5E6; --sun:#FFC83D;
  --r:20px; --shadow:0 2px 0 rgba(36,33,58,.06), 0 8px 24px rgba(36,33,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,247,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;flex:1;font-weight:800}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:42px;height:42px;border-radius:14px;font-size:20px;cursor:pointer;display:grid;place-items:center}
.pill{font-size:13px;background:var(--pri2);color:var(--pri);padding:4px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.hello{font-size:26px;font-weight:800;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r);padding:18px 14px;text-align:right;cursor:pointer;box-shadow:var(--shadow);min-height:118px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .em{font-size:34px}
.tile b{font-size:18px;display:block}
.tile small{color:rgba(36,33,58,.65);font-size:13px}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:14px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 6px;cursor:pointer;font-weight:600}
.seg.grades button{padding:10px 0;font-size:18px}
.seg button.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.lvdesc{font-size:13px;color:var(--muted);margin-top:8px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 3px 0 #3E33B8;font-size:17px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3E33B8}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.acc{background:var(--acc);box-shadow:0 3px 0 #D9573A}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #17784F}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row > *{min-width:0}
.grow{flex:1}
label.lbl{display:block;font-size:14px;color:var(--muted);margin:10px 0 6px;font-weight:500}
input.in,textarea.in{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none}
input.in:focus,textarea.in:focus{border-color:var(--pri)}
textarea.in{min-height:120px;resize:vertical}
.en{direction:ltr;unicode-bidi:isolate}
input.en,textarea.en{text-align:left}
.tabs{display:flex;background:#F3ECE0;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.bigword{font-size:44px;font-weight:800;text-align:center;margin:10px 0 4px;word-break:break-word}
.bigword.he{font-size:40px}
.qlabel{text-align:center;color:var(--muted);font-size:15px}
.speak{border:0;background:var(--acc2);color:var(--acc);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.center{text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 10px;font-size:20px;font-weight:600;cursor:pointer;min-height:64px}
.opt.ok{border-color:var(--ok);background:var(--ok2);color:#15734C}
.opt.bad{border-color:var(--bad);background:var(--bad2);color:#B4232C}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:14px;margin-top:14px;font-weight:600;text-align:center}
.fb.ok{background:var(--ok2);color:#15734C}
.fb.bad{background:var(--bad2);color:#B4232C}
.fb .ans{font-size:22px;display:block;margin-top:4px}
.scorebar{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px}
.progress{height:10px;background:#F0E8DA;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#8A7BFF);border-radius:99px;transition:width .3s}
.wlist{list-style:none;padding:0;margin:0}
.witem{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.witem:last-child{border-bottom:0}
.witem .w{flex:1;min-width:0}
.witem .w b{font-size:18px;display:block}
.witem .w span{color:var(--muted)}
.stat{font-size:12px;color:var(--muted);white-space:nowrap}
.mini{border:0;background:#F5F0E7;border-radius:12px;width:38px;height:38px;cursor:pointer;font-size:16px;flex:none}
.mini.danger{background:var(--bad2)}
.tag{font-size:12px;background:#F3ECE0;color:var(--muted);padding:2px 8px;border-radius:99px;margin-inline-start:6px}
.sentence{font-size:26px;line-height:1.6;text-align:center;font-weight:500;margin:10px 0}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--pri);color:var(--pri);font-weight:800;padding:0 6px}
.blank.ok{border-color:var(--ok);color:var(--ok);border-bottom-style:solid}
.blank.bad{border-color:var(--bad);color:var(--bad)}
.hint{background:#FFF4D6;border-radius:14px;padding:10px 14px;color:#7A5B00;margin-top:10px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .em{font-size:44px;display:block;margin-bottom:8px}
.note{font-size:14px;color:var(--muted);background:#F5F0E7;border-radius:14px;padding:10px 14px;margin-bottom:14px}
.prev{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prev input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
.prev input.in{padding:8px 10px;border-radius:10px}
.spinner{width:34px;height:34px;border:4px solid var(--pri2);border-top-color:var(--pri);border-radius:50%;animation:sp 0.8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.result{font-size:64px;font-weight:800;text-align:center;margin:4px 0}
.stars{font-size:38px;text-align:center;letter-spacing:6px}
.hist{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist:last-child{border-bottom:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;transition:transform .25s;z-index:20;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.file{border:2px dashed #D9CDBA;border-radius:var(--r);padding:26px 14px;text-align:center;cursor:pointer;display:block;background:#FFFCF7}
.file .em{font-size:40px;display:block}
.file input,label.btn input[type=file]{display:none}
label.btn{display:block;text-align:center}
[hidden]{display:none!important}
.streak{color:var(--acc);font-weight:700}
h2{font-size:18px;margin:0 0 10px}
.kidtag{font-size:12px;color:var(--pri);background:var(--pri2);padding:1px 8px;border-radius:99px;margin-inline-start:6px;white-space:nowrap}
.gift{font-size:60px;text-align:center}
.passage{font-size:20px;line-height:1.75;direction:ltr;text-align:left;white-space:pre-wrap}
.hl{background:#FFF1C7;border-bottom:2px solid var(--sun);border-radius:4px;cursor:pointer;padding:0 2px}
.qcard{border-top:1px solid var(--line);padding:14px 0}
.qcard:first-child{border-top:0}
.qtext{direction:ltr;text-align:left;font-weight:600;font-size:18px;margin-bottom:10px}
.mco{display:block;width:100%;text-align:left;direction:ltr;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:17px;cursor:pointer}
.mco.sel{border-color:var(--pri);background:var(--pri2)}
.mco.ok{border-color:var(--ok);background:var(--ok2)}
.mco.bad{border-color:var(--bad);background:var(--bad2)}
textarea.ans{direction:ltr;text-align:left;min-height:90px}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.badge.ok{background:var(--ok2);color:#15734C}.badge.mid{background:#FFF1C7;color:#7A5B00}.badge.bad{background:var(--bad2);color:#B4232C}
.model{direction:ltr;text-align:left;background:#F5F0E7;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.rlist .witem{cursor:pointer}
.gap{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:14px 0;direction:ltr}
.gl{min-width:19px;height:46px;display:grid;place-items:center;font-size:26px;font-weight:700}
.gl.sp{min-width:14px}
.gi{width:33px;height:46px;border:2px solid var(--pri);border-radius:10px;text-align:center;font-size:26px;font-weight:700;background:var(--pri2);color:var(--pri);padding:0;outline:none}
.gi:focus{box-shadow:0 0 0 3px rgba(91,79,224,.25)}
.gi.ok{border-color:var(--ok);background:var(--ok2);color:#15734C}
.gi.bad{border-color:var(--bad);background:var(--bad2);color:#B4232C}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:16px}
.chip.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.chip.add{border-style:dashed;color:var(--muted)}
.share{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.share > *{flex:1}
a.btn{display:inline-block;text-align:center;text-decoration:none}
</style>
</head>
<body>
<header class="top">
  <button id="back" class="iconbtn" aria-label="חזרה" hidden>→</button>
  <h1 id="title">מילים באנגלית</h1>
  <span id="count" class="pill"></span>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ew_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ew_' + k, JSON.stringify(v)); } catch { toast('השמירה במכשיר נכשלה'); } }
};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function speak(text) {
  try {
    const synth = window.speechSynthesis; if (!synth) { toast('ההשמעה לא נתמכת במכשיר הזה'); return; }
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.85;
    const vs = synth.getVoices();
    const v = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    synth.cancel(); synth.speak(u);
  } catch { }
}
try { window.speechSynthesis && speechSynthesis.getVoices(); } catch {}
const speakBtn = (text, label = 'הקשב') => h('button', { class: 'speak', type: 'button', onclick: () => speak(text) }, '🔊 ', label);
function loadScript(src) {
  return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
}

/* ---------- answer checks (forgiving about small typos) ---------- */
const normHe = s => (s || '').replace(/[֑-ׇ]/g, '').replace(/["'״׳.,!?\-()]/g, ' ').replace(/\s+/g, ' ').trim();
const heAlts = he => (he || '').split(/[,;\/]|\s+או\s+/).map(normHe).filter(Boolean);
const normEn = s => (s || '').toLowerCase().replace(/[^a-z\s']/g, ' ').replace(/\s+/g, ' ').trim();
const stripArt = s => s.replace(/^(to|a|an|the) /, '');
function lev(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 1) return 2;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function heOk(ans, w) {
  const a = normHe(ans).replace(/^ה/, ''); if (!a) return false;
  return heAlts(w.he).some(x => { x = x.replace(/^ה/, ''); return x === a || (x.length >= 4 && lev(a, x) <= 1); });
}
function enOk(ans, w) {
  const a = stripArt(normEn(ans)), e = stripArt(normEn(w.en));
  return !!a && (a === e || (e.length >= 5 && lev(a, e) <= 1));
}

/* ---------- free online translation (MyMemory) ---------- */
async function mm(q, pair) {
  const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${pair}`);
  const j = await r.json();
  const t = (j && j.responseData && j.responseData.translatedText) || '';
  if (String(j.responseStatus) !== '200' || !t) throw new Error('mm');
  return t.replace(/[.!]+$/, '').trim();
}
async function toHe(en) { const t = await mm(en, 'en|he'); if (!/[֐-׿]/.test(t)) throw new Error('bad'); return t; }
async function toEn(he) { const t = await mm(he, 'he|en'); if (!/[a-z]/i.test(t)) throw new Error('bad'); return t.toLowerCase(); }
async function translateMany(list, onProg) {
  const out = []; let i = 0, done = 0;
  const run = async () => { while (i < list.length) { const k = i++; try { out[k] = await toHe(list[k]); } catch { out[k] = ''; } done++; onProg && onProg(done, list.length); } };
  await Promise.all([run(), run(), run()]);
  return out;
}

/* ---------- state (everything stays on this phone) ---------- */
const LEVELS = {
  easy: { name: 'קל', desc: 'בחירה מתוך 4 תשובות, משפטים קצרים' },
  medium: { name: 'בינוני', desc: 'מקלידים את התרגום, אפשר לבקש רמז' },
  hard: { name: 'קשה', desc: 'מקלידים, גם מעברית לאנגלית. אפשר לבקש רמז' }
};
// grade (כיתה) decides the difficulty
const GRADES = { 'ג': 'easy', 'ד': 'easy', 'ה': 'medium', 'ו': 'medium', 'ז': 'hard', 'ח': 'hard', 'ט': 'hard' };
const GRADE_NUM = { 'ג': 3, 'ד': 4, 'ה': 5, 'ו': 6, 'ז': 7, 'ח': 8, 'ט': 9 };
const gradeName = g => `כיתה ${g}׳`;
const LVIDX = { easy: 0, medium: 1, hard: 2 };
// several kids can share one phone: each kid has own words, scores and grade
const S = { kids: LS.get('kids', []), kid: LS.get('kid', null), words: [], scores: [], grade: 'ה', level: 'medium', view: 'home', pack: null };
const curKid = () => S.kids.find(k => k.id === S.kid) || null;
const newKidId = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function useKid(id) {
  S.kid = id; LS.set('kid', id);
  const k = curKid();
  S.words = k ? LS.get('words_' + k.id, []) : [];
  S.scores = k ? LS.get('scores_' + k.id, []) : [];
  S.grade = k && GRADES[k.grade] ? k.grade : 'ה'; S.level = GRADES[S.grade];
}
function addKid(name, grade) {
  const k = { id: newKidId(), name: name.trim(), grade: GRADES[grade] ? grade : 'ה' };
  if (!S.kids.length) {   // first kid inherits words saved by the earlier one-kid version
    const old = LS.get('words', null);
    if (old) { LS.set('words_' + k.id, old); LS.set('scores_' + k.id, LS.get('scores', [])); try { localStorage.removeItem('ew_words'); localStorage.removeItem('ew_scores'); } catch { } }
  }
  S.kids = [...S.kids, k]; LS.set('kids', S.kids);
  return k;
}
const save = () => { if (S.kid) LS.set('words_' + S.kid, S.words); };
const wordId = en => en.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || ('w' + Date.now());
const findWord = en => S.words.find(w => w.id === wordId(en));
function upsert(w) {
  const i = S.words.findIndex(x => x.id === w.id);
  if (i >= 0) S.words[i] = { ...S.words[i], ...w }; else S.words.push(w);
}
function bump(w, ok) {
  const x = S.words.find(y => y.id === w.id); if (!x) return;
  const f = ok ? 'right' : 'wrong'; x[f] = (x[f] || 0) + 1; x.lastSeen = Date.now(); save();
}
function pickWords(n, excludeId, pool) {
  const arr = (pool || S.words).filter(w => w.id !== excludeId), out = [];
  while (out.length < n && arr.length) {
    const ws = arr.map(w => 1 + 2.5 * (w.wrong || 0) / (1 + (w.right || 0)));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
    for (; i < arr.length - 1; i++) { r -= ws[i]; if (r <= 0) break; }
    out.push(arr.splice(i, 1)[0]);
  }
  return out;
}
function distractors(w, n, field) {
  const seen = new Set([field === 'he' ? normHe(heAlts(w.he)[0]) : normEn(w.en)]);
  const out = [];
  for (const x of shuffle(S.words)) {
    if (x.id === w.id) continue;
    const val = field === 'he' ? x.he.split(/[,;\/]/)[0].trim() : x.en;
    const key = field === 'he' ? normHe(val) : normEn(val);
    if (seen.has(key)) continue; seen.add(key); out.push(val);
    if (out.length >= n) break;
  }
  return out;
}

/* ---------- word packs (links from Dad, and sharing back) ---------- */
// pack = {v:1, n:"name", w:[[en, he, [[sentence, hebrew], ...easy/medium/hard]], ...]}
function decodePack(str) {
  const m = String(str).match(/pack=([A-Za-z0-9+\-$]+)/);
  const code = m ? m[1] : String(str).trim();
  const p = JSON.parse(LZString.decompressFromEncodedURIComponent(code) || 'null');
  if (!p || !(Array.isArray(p.w) || p.rd || p.fb || p.ans)) throw new Error('pack');
  return p;
}
function encodePack(words, name, kid) {
  return LZString.compressToEncodedURIComponent(JSON.stringify({ v: 1, n: name, ...(kid ? { k: { name: kid.name, grade: kid.grade } } : {}), w: words.map(w => w.ex && w.ex.length ? [w.en, w.he, w.ex] : [w.en, w.he]) }));
}
function checkHash() {
  if (!/pack=/.test(location.hash)) return;
  try { S.pack = decodePack(location.hash); S.packErr = false; }
  catch { S.pack = null; S.packErr = true; }
  S.view = 'import';
  try { history.replaceState(null, '', location.pathname + location.search); } catch { }
}
window.addEventListener('hashchange', () => { checkHash(); render(); });

/* ---------- router ---------- */

const STOP = new Set(('a an the and or but if of to in on at by for with from is are was were be been being am do does did done have has had having will would can could should may might must shall ' +
  'i you he she it we they me him her us them my your his its our their mine yours this that these those there here what which who whom whose when where why how not no yes ' +
  'so than too very just also only then as up down out over under again all any both each few more most other some such own same into about after before above below off once ' +
  'don doesn isn aren wasn weren won didn can\'t don\'t it\'s i\'m ok oh let let\'s get got page name date class unit').split(' '));
function extractWords(text, max = 40) {
  const seen = new Set(), out = [];
  for (const m of text.matchAll(/[A-Za-z][A-Za-z']+/g)) {
    const w = m[0].replace(/'s$/i, '').toLowerCase();
    if (w.length < 3 || STOP.has(w) || seen.has(w)) continue;
    seen.add(w); out.push(w);
    if (out.length >= max) break;
  }
  return out;
}
async function shrinkImage(file, max) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.9));
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}
async function ocr(file, say) {
  say('מכין את קורא התמונות… (בפעם הראשונה זה לוקח קצת זמן)');
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const worker = await Tesseract.createWorker('eng', 1, { logger: m => { if (m.status === 'recognizing text') say(`קורא את התמונה… ${Math.round(m.progress * 100)}%`); } });
  try { return (await worker.recognize(await shrinkImage(file, 2000))).data.text; }
  finally { worker.terminate(); }
}
async function pdfText(file) {
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base + 'pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = '';
  for (let p = 1; p <= Math.min(pdf.numPages, 10); p++) out += (await (await pdf.getPage(p)).getTextContent()).items.map(i => i.str).join(' ') + '\n';
  return out;
}
async function docxText(file) {
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
}
async function fileText(f, say, label) {
  const name = f.name.toLowerCase();
  if (f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif)$/.test(name)) return ocr(f, t => say(label + t));
  say(label + 'קורא את הקובץ…');
  if (name.endsWith('.pdf')) return pdfText(f);
  if (name.endsWith('.docx')) return docxText(f);
  if (name.endsWith('.txt') || f.type.startsWith('text/')) return f.text();
  throw new Error('type');
}
// read several pages one after another, then translate the new words once
async function filesToCandidates(files, say, skip) {
  let text = '', ok = 0, lastErr = null;
  for (let i = 0; i < files.length; i++) {
    const label = files.length > 1 ? `דף ${i + 1} מתוך ${files.length}: ` : '';
    try { text += '\n' + (await fileText(files[i], say, label) || ''); ok++; } catch (e) { lastErr = e; }
  }
  if (!ok && lastErr) throw lastErr;
  if (lastErr) toast(`${files.length - ok} דפים לא נקראו`);
  const words = extractWords(text, 80).filter(w => !(skip && skip.has(wordId(w))));
  if (!words.length) throw new Error('notext');
  const tr = await translateMany(words, (d, t) => say(`מתרגם… ${d}/${t}`));
  return words.map((en, i) => ({ en, he: tr[i] || '' }));
}
const FILE_ERR = e => ({ type: 'סוג הקובץ לא נתמך. אפשר תמונה, PDF, Word או טקסט.', notext: 'לא מצאנו מילים (חדשות) באנגלית. נסו תמונה חדה יותר, באור טוב ומקרוב.' }[e && e.message]
  || (navigator.onLine ? 'לא הצלחנו לקרוא את הקובץ, נסו שוב' : 'צריך אינטרנט כדי לקרוא תמונות וקבצים'));

function openPreview(items, append) {
  const base = append && preview ? preview : [];
  const seen = new Set(base.map(x => wordId(x.en)));
  const add = items.filter(x => x.en && !seen.has(wordId(x.en)) && seen.add(wordId(x.en)))
    .map(x => ({ en: x.en.trim(), he: (x.he || '').trim(), exists: !!findWord(x.en), on: !findWord(x.en) }));
  if (append) toast(add.length ? `נוספו עוד ${add.length} מילים לרשימה` : 'לא נמצאו מילים חדשות בדף');
  if (!base.length && !add.length) { preview = null; toast('לא נמצאו מילים'); return; }
  preview = [...base, ...add];
  render();
}

    sel.forEach((x, n) => { const ex = findWord(x.en); upsert({ id: wordId(x.en), en: x.en.trim(), he: x.he.trim(), addedAt: ex?.addedAt || Date.now() + n, right: ex?.right || 0, wrong: ex?.wrong || 0 }); });
    save(); toast(`נוספו ${sel.length} מילים! 🎉`); preview = null; render();
  };
  upd();
  const more = h('div');

  app.append(h('div', { class: 'card' },
    h('h2', {}, `נמצאו ${preview.length} מילים`),

    h('label', { class: 'btn sec block', style: 'margin:4px 0 8px' }, moreIn, '📷 הוספת עוד דף'), more,
    rows,
    h('div', { class: 'row', style: 'margin-top:14px' },
      h('button', { class: 'btn sec', onclick: () => { preview = null; render(); } }, 'ביטול'), h('div', { class: 'grow' }, btn))));
}

// rd = {id, t: title, th: Hebrew title, x: text, g: grade, u: words used, mc: [{q, o, a}], op: [{q, m: model answer, kw: [[alternatives]]}]}
const readsKey = id => 'reads_' + id;
const getReads = (id = S.kid) => id ? LS.get(readsKey(id), []) : [];
const setReads = (list, id = S.kid) => LS.set(readsKey(id), list);
const newReads = () => getReads().filter(r => !r.ans).length;
function kwCheck(ans, kw) {   // quick self-check before Dad's real check: are the key ideas there?
  if (!kw || !kw.length) return null;
  const a = ' ' + normEn(ans) + ' ', words = a.trim().split(' ');
  const hit = g => g.some(alt => { alt = normEn(alt); if (!alt) return false; if (a.includes(' ' + alt + ' ') || a.includes(' ' + alt)) return true; return !alt.includes(' ') && alt.length >= 5 && words.some(x => lev(x, alt) <= 1); });
  return kw.filter(hit).length / kw.length;
}

// all answers that weren't checked yet go to Dad in one small file
async function sendAnswersToDad() {
  const k = curKid(); if (!k) return;
  const list = getReads().filter(r => r.ans && !r.fb);
  if (!list.length) return toast('אין תשובות שמחכות לבדיקה');
  const base = location.origin + location.pathname + '#pack=';
  const body = list.map(r => r.rd.t + '\n' + base + LZString.compressToEncodedURIComponent(JSON.stringify({ v: 1, n: k.name, k: { name: k.name, grade: k.grade }, ans: { r: r.rd.id, t: r.rd.t, mc: r.ans.mc, op: r.ans.op, at: r.ans.at } }))).join('\n\n');
  const text = `התשובות של ${k.name} (${list.length} קטעים)\nאבא: באפליקציה ב-Claude ← קטעי קריאה ← בדיקת תשובות ← בחירת קובץ\n\n${body}\n`;
  const d = new Date(), fname = `answers-${k.name}-${d.getDate()}.${d.getMonth() + 1}-${d.getHours()}${String(d.getMinutes()).padStart(2, '0')}.txt`;
  const file = new File([text], fname, { type: 'text/plain' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'תשובות לאבא' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fname; document.body.append(a); a.click(); a.remove();
  toast('הקובץ נשמר בהורדות. שלחי אותו לאבא בוואטסאפ');
}

    h('div', { class: 'seg', style: 'margin-bottom:12px' }, sizes.map(n => h('button', { class: testN === n ? 'on' : '', onclick: () => { testN = n; render(); } }, String(n)))),
    h('button', { class: 'btn sec block', onclick: () => { Q = buildTest(testN); render(); } }, `מבחן של ${testN} מילים`)));
  const myScores = S.scores.filter(s => !S.kid || !s.kid || s.kid === S.kid);
  if (myScores.length) app.append(h('div', { class: 'card' }, h('h2', {}, 'מבחנים קודמים'),
    myScores.slice(0, 8).map(s => h('div', { class: 'hist' },
      h('span', {}, `${fmt(s.at)} · ${s.full ? 'מלא' : 'מילים'} · ${s.grade ? gradeName(s.grade) : (LEVELS[s.level]?.name || '')}`),
      h('b', {}, `${Math.round(s.score / s.total * 100)}%`)))));
}
const newQ = full => ({ i: 0, pts: 0, max: 0, pend: 0, wrong: [], full, level: S.level, grade: S.grade, kid: S.kid, items: [] });
function wordTypes(mcOk, kinds) { return t => (!mcOk && t.startsWith('mc')) ? t.replace('mc', 'type') : t; }
function buildTest(n) {
  const q = newQ(false), mcOk = S.words.length >= 4, fix = wordTypes(mcOk);
  const types = { easy: ['mc_en_he', 'mc_he_en', 'gap_he_en'], medium: ['mc_en_he', 'type_en_he', 'mc_he_en', 'gap_he_en'], hard: ['type_en_he', 'type_he_en'] }[S.level];
  q.items = pickWords(Math.min(n, S.words.length)).map(w => ({ sec: 'words', w, t: fix(types[Math.floor(Math.random() * types.length)]) }));
  return q;
}
async function buildFullTest() {
  const q = newQ(true), sp = FULL_SPEC[S.level], all = S.words, mcOk = all.length >= 4, fix = wordTypes(mcOk);
  const tr = { easy: ['mc_en_he', 'mc_he_en'], medium: ['mc_en_he', 'type_en_he', 'mc_he_en'], hard: ['type_en_he', 'mc_he_en'] }[S.level];
  const used = new Set();
  const take = (n, pool) => { const ws = pickWords(n, null, (pool || all).filter(w => !used.has(w.id))); ws.forEach(w => used.add(w.id)); return ws; };
  take(Math.min(sp.w, all.length), all).forEach(w => q.items.push({ sec: 'words', w, t: fix(tr[Math.floor(Math.random() * tr.length)]) }));
  let spl = take(sp.sp); if (!spl.length) spl = pickWords(Math.min(sp.sp, all.length));
  spl.forEach(w => q.items.push({ sec: 'spell', w, t: S.level === 'hard' ? 'type_he_en' : 'gap_he_en' }));
  let sen = take(sp.sen, all.filter(hasSentence)); if (!sen.length) sen = pickWords(sp.sen, null, all.filter(hasSentence));
  sen.forEach(w => q.items.push({ sec: 'sen', w, t: 'sen' }));
  const r = await kidTestReading();
  if (r) q.items.push({ sec: 'read', t: 'read', rd: r.rd, id: r.id });
  return q;
}
function testEnd(app) {
  const pct = Q.max ? Math.round(Q.pts / Q.max * 100) : 0;
  if (!Q.saved) { Q.saved = true; kidSaveScore({ score: Math.round(Q.pts * 10) / 10, total: Q.max || 1, full: Q.full, level: Q.level, grade: Q.grade, ...(Q.kid ? { kid: Q.kid } : {}), at: Date.now() }); }
  const stars = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : pct >= 40 ? '⭐' : '💪';
  const msg = pct === 100 ? 'מושלם! כל הכבוד! 🎉' : pct >= 80 ? 'מצוין!' : pct >= 60 ? 'יפה מאוד, ממשיכים להתאמן' : 'עוד קצת תרגול ונצליח!';
  const secs = Q.full ? ['words', 'spell', 'sen', 'read'].map(sname => {
    const its = Q.items.filter(x => x.sec === sname); if (!its.length) return null;
    return h('span', { class: 'tag', style: 'margin:2px' }, `${SEC_NAME[sname]}: ${its.length}`);
  }) : null;
  app.append(h('div', { class: 'card center' },
    h('div', { class: 'stars' }, stars), h('div', { class: 'result' }, `${pct}%`),
    h('p', { class: 'sub' }, `${Math.round(Q.pts * 10) / 10} נקודות מתוך ${Q.max}`), secs ? h('div', { class: 'chips', style: 'justify-content:center;gap:6px;margin:4px 0 8px' }, secs) : null, h('h2', {}, msg)));
  if (Q.pend) app.append(h('div', { class: 'card center' }, h('p', { class: 'sub', style: 'margin:0 0 10px' }, `את ${Q.pend} השאלות הפתוחות בקטע הקריאה אבא ו-Claude יבדקו`), h('button', { class: 'btn ok block', onclick: sendAnswersToDad }, '📎 שליחת התשובות לאבא')));
  if (Q.wrong.length) app.append(h('div', { class: 'card' }, h('h2', {}, 'מילים לחזור עליהן'),
    h('ul', { class: 'wlist' }, Q.wrong.map(w => h('li', { class: 'witem' },
      h('button', { class: 'mini', onclick: () => speak(w.en) }, '🔊'),
      h('div', { class: 'w' }, h('b', { class: 'en' }, w.en), h('span', {}, w.he)))))));
  app.append(h('div', { class: 'row' },
    h('button', { class: 'btn sec grow', onclick: () => go('home') }, 'לדף הבית'),
    h('button', { class: 'btn grow', onclick: () => { Q = null; render(); } }, 'מבחן נוסף')));
}
// reading section on the kids' phone: a passage she hasn't answered yet; open answers go to Dad for checking
function kidTestReading() { const it = getReads().find(r => !r.ans); return it ? { rd: it.rd, id: it.rd.id } : null; }
async function kidReadSubmit(it, ans) {
  const rd = it.rd, list = getReads(), e = list.find(r => r.rd.id === rd.id);
  if (e) { e.ans = ans; delete e.draft; setReads(list); }
  return { pts: rd.mc.filter((q, i) => ans.mc[i] === q.a).length, max: rd.mc.length, pending: rd.op.length };
}
function kidSaveScore(sc) { S.scores = [sc, ...S.scores].slice(0, 30); LS.set('scores_' + S.kid, S.scores); }
